name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily update"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static upload
        run: |
          mkdir -p _pages
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude='.git/' --exclude='.github/' --exclude='pipeline/' --exclude='work/' --exclude='outputs/' ./ _pages/
          else
            find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec cp -R {} _pages/ \;
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
